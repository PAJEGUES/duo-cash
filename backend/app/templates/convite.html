<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Convite DuoCash</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(160deg, #6d4fc2 0%, #4b3394 100%); color: #1f1a2e; padding: 24px;
    }
    .card {
      background: #fff; border-radius: 24px; padding: 32px 24px; max-width: 380px; width: 100%;
      text-align: center; box-shadow: 0 12px 40px rgba(0, 0, 0, .25);
    }
    .logo { font-size: 48px; margin-bottom: 8px; }
    h1 { margin: 0 0 8px; font-size: 24px; color: #6d4fc2; }
    p { margin: 0 0 24px; line-height: 1.5; color: #4a4560; }
    .btn {
      display: block; background: #6d4fc2; color: #fff; text-decoration: none; font-weight: 700;
      font-size: 18px; padding: 18px 20px; border-radius: 16px;
    }
    .btn:active { background: #5a3fa8; }
    .hint { margin: 24px 0 0; font-size: 14px; color: #7a7590; }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo" aria-hidden="true">💑</div>
    <h1>DuoCash</h1>
    {% if token %}
    <p>Você recebeu um convite para participar de um ambiente compartilhado no DuoCash.</p>
    <a class="btn" href="duocash://join/{{ token }}">Abrir no app DuoCash</a>
    {% else %}
    <p>Este link de convite não é válido. Peça um novo convite para quem te chamou.</p>
    {% endif %}
    <p class="hint">Ainda não tem o app? Peça o APK para quem te convidou.</p>
  </main>
</body>
</html>
