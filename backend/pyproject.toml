[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "BLE", "C4", "PT"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # textos em pt-BR com acentos e emojis
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311", "PT006", "PT011", "PT018"]
"migrations/**" = ["E501"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "migrations"]
