<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DuoCash - Novo gasto</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body style="padding-bottom: 20px">

  <div class="status"><span>9:41</span><span>📶 🔋</span></div>
  <div class="cabecalho"><a class="voltar" href="ambientes.html">‹</a> Novo gasto</div>

  <div class="conteudo" style="padding-top: 0">

    <div class="valor-grande">
      <small>Valor</small>
      <strong><span>R$</span>86,00</strong>
    </div>

    <div class="campo">
      <label>Descrição <span id="contador">15/100</span></label>
      <div class="entrada">✏️ <span>Cinema + pipoca</span></div>
    </div>

    <div class="campo">
      <label>Data</label>
      <div class="entrada">📅 <span>12/10/2026</span></div>
    </div>

    <div class="campo">
      <label>Categoria <span>ver todas (17)</span></label>
      <div class="chips" id="categorias">
        <span class="chip">🛒 Alimentação</span>
        <span class="chip ativo" data-lazer>🎉 Lazer</span>
        <span class="chip">🚗 Transporte</span>
        <span class="chip">💊 Saúde</span>
      </div>
    </div>

    <div class="campo" id="galeria">
      <label>Ícone do lazer</label>
      <div class="icones">
        <button class="ativo"><span>🎬</span>Cinema</button>
        <button><span>🍽️</span>Restaurante</button>
        <button><span>🍻</span>Bar</button>
        <button><span>✈️</span>Viagem</button>
        <button><span>🎤</span>Show</button>
        <button><span>🎮</span>Jogos</button>
        <button><span>📺</span>Streaming</button>
        <button><span>⚽</span>Esportes</button>
      </div>
    </div>

    <p class="autor"><span class="avatar p">L</span> Lançado por <b>Lucas</b> em <b>Casa</b></p>
    <a class="btn" href="resumo.html">Salvar gasto</a>

  </div>

  <script src="js/novo-gasto.js"></script>
</body>
</html>
